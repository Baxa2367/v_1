name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: C++20 build & unit tests
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ca-certificates \
            libdrogon-dev libpqxx-dev libsodium-dev nlohmann-json3-dev \
            libspdlog-dev libgtest-dev libxlsxwriter-dev libhpdf-dev \
            libssl-dev libcurl4-openssl-dev
      - name: Configure
        run: cmake -S backend -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

  frontend:
    name: React build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund
      - run: npm run build

  seeds:
    name: Seed content validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-seeds.mjs
