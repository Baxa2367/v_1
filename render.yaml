services:
  - type: web
    name: lumina
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./docker/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lumina-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Almaty
      - key: MIGRATIONS_DIR
        value: /app/db/migrations
      - key: SEEDS_DIR
        value: /app/seeds
      - key: PUBLIC_DIR
        value: /app/public
      - key: RUN_MIGRATIONS
        value: "1"
      - key: RUN_SEED
        value: "1"
      - key: DEMO_MODE
        value: "0"
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        fromService:
          name: lumina
          type: web
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: lumina-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: lumina
    user: lumina
