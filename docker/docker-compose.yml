name: lumina

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: lumina
      POSTGRES_DB: lumina
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina -d lumina"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgresql://lumina:lumina@db:5432/lumina
      PORT: 8080
      JWT_SECRET: change-me-in-production-please-32-bytes
      APP_TIMEZONE: Asia/Qyzylorda
      REDIS_URL: redis://redis:6379
      RUN_MIGRATIONS: "1"
      RUN_SEED: "1"
      CORS_ORIGIN: "*"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8080:8080"

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["lumina_worker"]
    environment:
      DATABASE_URL: postgresql://lumina:lumina@db:5432/lumina
      JWT_SECRET: change-me-in-production-please-32-bytes
      APP_TIMEZONE: Asia/Qyzylorda
      REDIS_URL: redis://redis:6379
      RUN_MIGRATIONS: "1"
      RUN_SEED: "0"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  pgdata:
